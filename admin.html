<script type="text/babel">

const {
  useState,
  useEffect,
  useMemo,
  useRef
} = React;


// ======================================================
// EDUSHOT CONFIG
// ======================================================

const SUPABASE_URL =
  "https://lmcebpymlekptqowofyg.supabase.co";

const SUPABASE_ANON_KEY =
  "sb_publishable_i5T1e4AbawLisqsgDEbxdw_vsb5CaRH";

const ADMIN_API_URL =
  window.EDUSHOT_ADMIN_API_URL ||
  "https://edushot-admin-api.edushot.workers.dev";

const SCHEDULER_API_URL =
  window.EDUSHOT_SCHEDULER_API_URL ||
  "https://edushot-calcom-sync.edushot.workers.dev";

const supabase =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
  );


// ======================================================
// HELPERS
// ======================================================

const Icon = ({
  name,
  size = 18
}) => {

  const ref =
    useRef(null);

  useEffect(() => {

    if (
      ref.current &&
      window.lucide
    ) {

      ref.current.innerHTML =
        `<i data-lucide="${name}"></i>`;

      window.lucide.createIcons({
        root: ref.current,
        attrs: {
          width: size,
          height: size
        }
      });

    }

  }, [name, size]);

  return (
    <span
      ref={ref}
      className="inline-flex items-center justify-center shrink-0"
    />
  );
};


const Toast = ({
  msg,
  type = "success",
  onClose
}) => {

  useEffect(() => {

    const t =
      setTimeout(
        onClose,
        5000
      );

    return () =>
      clearTimeout(t);

  }, [onClose]);

  return (
    <div
      className={`
        fixed
        bottom-6
        right-6
        z-[200]
        max-w-md
        px-5
        py-4
        rounded-2xl
        shadow-2xl
        text-xs
        font-extrabold
        border
        ${
          type === "error"
            ? "bg-rose-950 text-white border-rose-800"
            : "bg-slate-950 text-white border-slate-700"
        }
      `}
    >
      {msg}
    </div>
  );
};


const plMoney = value =>
  `${Number(value || 0).toLocaleString(
    "pl-PL",
    {
      minimumFractionDigits: 2,
      maximumFractionDigits: 2
    }
  )} zł`;


const plDate = value => {

  if (!value)
    return "—";

  return new Date(
    `${value}T12:00:00`
  ).toLocaleDateString(
    "pl-PL"
  );

};


const monthName = (
  year,
  month
) => {

  const date =
    new Date(
      year,
      month - 1,
      1
    );

  return date
    .toLocaleDateString(
      "pl-PL",
      {
        month: "long",
        year: "numeric"
      }
    )
    .replace(
      /^./,
      c => c.toUpperCase()
    );

};


const statusBadge = status => {

  const map = {

    active:
      "bg-emerald-100 text-emerald-700",

    inactive:
      "bg-slate-100 text-slate-500",

    scheduled:
      "bg-purple-100 text-purple-700",

    completed:
      "bg-emerald-100 text-emerald-700",

    cancelled:
      "bg-rose-100 text-rose-700",

    OPEN:
      "bg-purple-100 text-purple-700",

    READY_TO_PAY:
      "bg-amber-100 text-amber-700",

    PAID:
      "bg-emerald-100 text-emerald-700",

    OVERDUE:
      "bg-rose-100 text-rose-700",

    ADJUSTED:
      "bg-blue-100 text-blue-700"
  };

  return (
    map[status] ||
    "bg-slate-100 text-slate-500"
  );

};


// ======================================================
// APP
// ======================================================

function AdminApp() {

  const [
    session,
    setSession
  ] = useState(null);

  const [
    loadingAuth,
    setLoadingAuth
  ] = useState(true);

  const [
    authError,
    setAuthError
  ] = useState(null);

  const [
    loginEmail,
    setLoginEmail
  ] = useState("");

  const [
    loginPassword,
    setLoginPassword
  ] = useState("");

  const [
    activeTab,
    setActiveTab
  ] = useState("dashboard");

  const [
    tutors,
    setTutors
  ] = useState([]);

  const [
    lessons,
    setLessons
  ] = useState([]);

  const [
    finances,
    setFinances
  ] = useState([]);

  const [
    students,
    setStudents
  ] = useState([]);

  const [
    payouts,
    setPayouts
  ] = useState([]);

  const [
    toast,
    setToast
  ] = useState(null);

  const [
    loadingData,
    setLoadingData
  ] = useState(false);

  const [
    actionLoading,
    setActionLoading
  ] = useState(false);

  const [
    tutorModal,
    setTutorModal
  ] = useState(false);

  const [
    editingTutor,
    setEditingTutor
  ] = useState(null);

  const [
    previewTutor,
    setPreviewTutor
  ] = useState(null);

  const [
    lessonModal,
    setLessonModal
  ] = useState(null);

  const [
    apiStatus,
    setApiStatus
  ] = useState("checking");

  const [
    lessonFilter,
    setLessonFilter
  ] = useState("all");

  const [
    search,
    setSearch
  ] = useState("");


  const showToast = (
    msg,
    type = "success"
  ) =>
    setToast({
      msg,
      type
    });


  // ====================================================
  // AUTH
  // ====================================================

  useEffect(() => {

    supabase.auth
      .getSession()
      .then(
        ({
          data: {
            session: activeSession
          }
        }) => {

          if (activeSession)
            verifyAdmin(
              activeSession
            );
          else
            setLoadingAuth(false);

        }
      );


    const {
      data: authListener
    } =
      supabase.auth
        .onAuthStateChange(
          (
            _event,
            activeSession
          ) => {

            if (
              !activeSession
            ) {

              setSession(null);
              setLoadingAuth(false);

            }

          }
        );


    return () =>
      authListener
        ?.subscription
        ?.unsubscribe();

  }, []);


  async function verifyAdmin(
    activeSession
  ) {

    setLoadingAuth(true);
    setAuthError(null);

    try {

      const {
        data,
        error
      } =
        await supabase
          .from(
            "user_roles"
          )
          .select(
            "role"
          )
          .eq(
            "user_id",
            activeSession.user.id
          )
          .maybeSingle();


      if (
        error ||
        data?.role !==
          "admin"
      ) {

        throw new Error(
          "Brak uprawnień administratora."
        );

      }


      setSession(
        activeSession
      );

      await Promise.all([
        loadData(),
        checkApi()
      ]);


    } catch (
      error
    ) {

      console.error(
        error
      );

      await supabase.auth
        .signOut();

      setAuthError(
        "To konto nie posiada uprawnień administratora."
      );

    } finally {

      setLoadingAuth(false);

    }

  }


  async function handleLogin(
    event
  ) {

    event.preventDefault();

    setLoadingAuth(true);
    setAuthError(null);

    const {
      data,
      error
    } =
      await supabase.auth
        .signInWithPassword({
          email:
            loginEmail.trim(),
          password:
            loginPassword
        });


    if (
      error ||
      !data?.session
    ) {

      console.error(
        error
      );

      setAuthError(
        error?.message ||
        "Błędny e-mail lub hasło."
      );

      setLoadingAuth(false);

      return;

    }


    await verifyAdmin(
      data.session
    );

  }


  // ====================================================
  // BACKEND API
  // ====================================================

  async function apiRequest(
    endpoint,
    options = {}
  ) {

    const {
      data: {
        session:
          currentSession
      }
    } =
      await supabase.auth
        .getSession();


    if (
      !currentSession
        ?.access_token
    ) {

      throw new Error(
        "Sesja administratora wygasła."
      );

    }


    const url =
      `${ADMIN_API_URL.replace(/\/+$/, "")}${endpoint}`;


    let response;

    try {

      response =
        await fetch(
          url,
          {
            ...options,

            headers: {
              Accept:
                "application/json",

              "Content-Type":
                "application/json",

              Authorization:
                `Bearer ${currentSession.access_token}`,

              ...(
                options.headers ||
                {}
              )
            }
          }
        );

    } catch (
      error
    ) {

      console.error(
        error
      );

      throw new Error(
        "Nie udało się połączyć z backendem EduSHOT."
      );

    }


    const raw =
      await response.text();

    let body = null;

    try {

      body =
        raw
          ? JSON.parse(raw)
          : null;

    } catch {

      throw new Error(
        `Backend zwrócił nieprawidłową odpowiedź HTTP ${response.status}.`
      );

    }


    if (
      !response.ok ||
      body?.ok === false
    ) {

      throw new Error(
        body?.error
          ?.message ||
        body?.error ||
        body?.message ||
        `Błąd API ${response.status}`
      );

    }


    return (
      body?.data ??
      body
    );

  }


  async function checkApi() {

    try {

      const response =
        await fetch(
          `${ADMIN_API_URL}/api/health`
        );

      const data =
        await response.json();

      setApiStatus(
        data?.ok
          ? "online"
          : "offline"
      );

    } catch {

      setApiStatus(
        "offline"
      );

    }

  }


  // ====================================================
  // LOAD DATA
  // ====================================================

  async function loadData() {

    setLoadingData(true);

    const results =
      await Promise.allSettled([

        supabase
          .from("tutors")
          .select("*")
          .order(
            "created_at",
            {
              ascending:
                false
            }
          ),

        supabase
          .from("lessons")
          .select("*")
          .order(
            "lesson_date",
            {
              ascending:
                false
            }
          )
          .order(
            "time_start",
            {
              ascending:
                false
            }
          ),

        supabase
          .from(
            "lesson_finance"
          )
          .select("*"),

        supabase
          .from("students")
          .select("*")
          .order(
            "created_at",
            {
              ascending:
                false
            }
          ),

        supabase
          .from(
            "payout_periods"
          )
          .select("*")
          .order(
            "year",
            {
              ascending:
                false
            }
          )
          .order(
            "month",
            {
              ascending:
                false
            }
          )

      ]);


    const extract = (
      result
    ) => {

      if (
        result.status !==
        "fulfilled"
      )
        return [];

      if (
        result.value
          ?.error
      ) {

        console.warn(
          result.value.error
        );

        return [];

      }

      return (
        result.value
          ?.data || []
      );

    };


    setTutors(
      extract(
        results[0]
      )
    );

    setLessons(
      extract(
        results[1]
      )
    );

    setFinances(
      extract(
        results[2]
      )
    );

    setStudents(
      extract(
        results[3]
      )
    );

    setPayouts(
      extract(
        results[4]
      )
    );


    setLoadingData(false);

  }


  // ====================================================
  // TUTORS
  // ====================================================

  async function saveTutor(
    event
  ) {

    event.preventDefault();

    setActionLoading(
      true
    );


    const fd =
      new FormData(
        event.currentTarget
      );


    const payload = {

      name:
        String(
          fd.get("name") ||
          ""
        ).trim(),

      email:
        String(
          fd.get("email") ||
          ""
        )
          .trim()
          .toLowerCase(),

      iban:
        String(
          fd.get("iban") ||
          ""
        ).trim(),

      calSlug:
        String(
          fd.get("calSlug") ||
          ""
        ).trim()

    };


    try {

      if (
        editingTutor
      ) {

        await apiRequest(
          `/api/admin/tutors/${editingTutor.id}`,
          {
            method:
              "PATCH",

            body:
              JSON.stringify(
                payload
              )
          }
        );

        showToast(
          "Dane korepetytora zostały zapisane."
        );

      } else {

        await apiRequest(
          "/api/admin/tutors",
          {
            method:
              "POST",

            body:
              JSON.stringify(
                payload
              )
          }
        );

        showToast(
          "Korepetytor został dodany."
        );

      }


      setTutorModal(
        false
      );

      setEditingTutor(
        null
      );

      await loadData();


    } catch (
      error
    ) {

      console.error(
        error
      );

      showToast(
        error.message,
        "error"
      );

    } finally {

      setActionLoading(
        false
      );

    }

  }


  async function setTutorStatus(
    tutor,
    status
  ) {

    const question =
      status ===
      "inactive"

        ? `Dezaktywować konto ${tutor.name}?`

        : `Przywrócić konto ${tutor.name}?`;


    if (
      !confirm(
        question
      )
    )
      return;


    try {

      await apiRequest(
        `/api/admin/tutors/${tutor.id}`,
        {
          method:
            "PATCH",

          body:
            JSON.stringify({
              status
            })
        }
      );


      showToast(
        status ===
        "inactive"

          ? "Konto zostało dezaktywowane."

          : "Konto zostało przywrócone."
      );


      await loadData();


    } catch (
      error
    ) {

      showToast(
        error.message,
        "error"
      );

    }

  }


  async function permanentDeleteTutor(
    tutor
  ) {

    if (
      !confirm(
        `Czy na pewno chcesz TRWALE usunąć ${tutor.name}?\n\nUsunięte zostanie konto logowania oraz dane powiązane z tym korepetytorem.`
      )
    )
      return;


    const typed =
      prompt(
        "Aby potwierdzić operację wpisz dokładnie:\n\nUSUŃ"
      );


    if (
      typed !==
      "USUŃ"
    ) {

      showToast(
        "Usuwanie anulowane.",
        "error"
      );

      return;

    }


    setActionLoading(
      true
    );


    try {

      await apiRequest(
        `/api/admin/tutors/${tutor.id}`,
        {
          method:
            "DELETE"
        }
      );


      showToast(
        `${tutor.name} został trwale usunięty.`
      );


      setPreviewTutor(
        null
      );

      await loadData();


    } catch (
      error
    ) {

      console.error(
        error
      );

      showToast(
        error.message,
        "error"
      );

    } finally {

      setActionLoading(
        false
      );

    }

  }


  // ====================================================
  // PAYOUTS
  // ====================================================

  async function generateTwelveMonths(
    tutor
  ) {

    setActionLoading(
      true
    );

    try {

      const now =
        new Date();


      for (
        let i = 0;
        i < 12;
        i++
      ) {

        const date =
          new Date(
            now.getFullYear(),
            now.getMonth() - i,
            1
          );


        const {
          error
        } =
          await supabase.rpc(
            "refresh_payout_period",
            {

              p_tutor_id:
                tutor.id,

              p_year:
                date.getFullYear(),

              p_month:
                date.getMonth() + 1

            }
          );


        if (
          error
        )
          throw error;

      }


      showToast(
        "Historia 12 miesięcy została przeliczona."
      );


      await loadData();


    } catch (
      error
    ) {

      showToast(
        error.message,
        "error"
      );

    } finally {

      setActionLoading(
        false
      );

    }

  }


  async function markPaid(
    period
  ) {

    if (
      !confirm(
        `Oznaczyć ${monthName(period.year, period.month)} jako wypłacone?`
      )
    )
      return;


    const reference =
      prompt(
        "Numer/reference przelewu (opcjonalnie):"
      );


    try {

      const {
        error
      } =
        await supabase.rpc(
          "mark_payout_paid",
          {

            p_period_id:
              period.id,

            p_reference:
              reference ||
              null

          }
        );


      if (
        error
      )
        throw error;


      showToast(
        "Rozliczenie oznaczone jako wypłacone."
      );


      await loadData();


    } catch (
      error
    ) {

      showToast(
        error.message,
        "error"
      );

    }

  }


  // ====================================================
  // COMPUTED
  // ====================================================

  const today =
    new Date()
      .toISOString()
      .slice(
        0,
        10
      );


  const monthKey =
    today.slice(
      0,
      7
    );


  const metrics =
    useMemo(
      () => {

        const activeTutors =
          tutors.filter(
            t =>
              t.status ===
              "active"
          ).length;


        const todayLessons =
          lessons.filter(
            l =>
              l.lesson_date ===
              today
          ).length;


        const monthLessons =
          lessons.filter(
            l =>
              l.lesson_date
                ?.startsWith(
                  monthKey
                )
          ).length;


        const revenue =
          finances.reduce(
            (
              sum,
              f
            ) =>
              sum +
              Number(
                f.student_price ||
                0
              ),
            0
          );


        const tutorCost =
          finances.reduce(
            (
              sum,
              f
            ) =>
              sum +
              Number(
                f.tutor_rate ||
                0
              ),
            0
          );


        const fees =
          finances.reduce(
            (
              sum,
              f
            ) =>
              sum +
              Number(
                f.payment_fee ||
                0
              ),
            0
          );


        const margin =
          revenue -
          tutorCost -
          fees;


        const toPay =
          payouts
            .filter(
              p =>
                [
                  "READY_TO_PAY",
                  "OVERDUE"
                ].includes(
                  p.status
                )
            )
            .reduce(
              (
                sum,
                p
              ) =>
                sum +
                Number(
                  p.total_amount ||
                  0
                ),
              0
            );


        return {

          activeTutors,
          todayLessons,
          monthLessons,
          revenue,
          tutorCost,
          fees,
          margin,
          toPay

        };

      },
      [
        tutors,
        lessons,
        finances,
        payouts,
        today,
        monthKey
      ]
    );


  const filteredLessons =
    useMemo(
      () => {

        return lessons
          .filter(
            lesson => {

              const matchesSearch =
                (
                  `${lesson.student_name || ""} ${lesson.student_email || ""} ${lesson.subject || ""}`
                )
                  .toLowerCase()
                  .includes(
                    search
                      .toLowerCase()
                  );


              const matchesStatus =
                lessonFilter ===
                "all"

                ? true

                : lesson.status ===
                  lessonFilter;


              return (
                matchesSearch &&
                matchesStatus
              );

            }
          );

      },
      [
        lessons,
        search,
        lessonFilter
      ]
    );


  const tutorLessonCount =
    tutorId =>
      lessons.filter(
        l =>
          l.tutor_id ===
          tutorId
      ).length;


  // ====================================================
  // UI COMPONENTS
  // ====================================================

  const Nav = ({
    id,
    label,
    icon,
    badge
  }) => (

    <button

      onClick={() =>
        setActiveTab(id)
      }

      className={`
        w-full
        flex
        items-center
        gap-3
        px-4
        py-3.5

                                                className="text-emerald-600 font-black"

                                                Oznacz wypłacone
                                              </button>
                                            )
                                          }

                                        </td>

                                      </tr>

                                    )
                                  )
                                }

                              </tbody>

                            </table>

                          </div>


                          {
                            !history.length &&
                            (
                              <div
                                className="text-xs text-slate-400 mt-3"
                              >
                                Brak wygenerowanej historii. Kliknij „Przelicz 12 miesięcy”.
                              </div>
                            )
                          }

                        </div>

                      );

                    }
                  )
                }

              </section>
            )
          }


          {/* FINANCE */}

          {
            activeTab ===
            "finance" &&
            (
              <section
                className="space-y-5"
              >

                <div
                  className="grid grid-cols-2 xl:grid-cols-4 gap-4"
                >

                  {
                    [
                      [
                        "Przychód",
                        metrics.revenue
                      ],
                      [
                        "Koszt tutorów",
                        metrics.tutorCost
                      ],
                      [
                        "Prowizje",
                        metrics.fees
                      ],
                      [
                        "Marża",
                        metrics.margin
                      ]
                    ].map(
                      (
                        item,
                        index
                      ) => (

                        <div
                          key={index}
                          className="card p-5"
                        >

                          <div
                            className="text-[9px] uppercase font-black text-slate-400"
                          >
                            {item[0]}
                          </div>

                          <div
                            className="text-2xl font-black mt-2"
                          >
                            {
                              plMoney(
                                item[1]
                              )
                            }
                          </div>

                        </div>

                      )
                    )
                  }

                </div>

              </section>
            )
          }


          {/* INTEGRATIONS */}

          {
            activeTab ===
            "integrations" &&
            (
              <section
                className="grid md:grid-cols-2 gap-4"
              >

                <div
                  className="card p-6"
                >

                  <h3
                    className="font-black text-lg"
                  >
                    Supabase
                  </h3>

                  <p
                    className="text-xs text-slate-400 mt-2"
                  >
                    Authentication, baza danych, RLS i Realtime.
                  </p>

                  <div
                    className="mt-4 text-xs font-black text-emerald-600"
                  >
                    ● Połączono
                  </div>

                </div>


                <div
                  className="card p-6"
                >

                  <h3
                    className="font-black text-lg"
                  >
                    EduSHOT Admin API
                  </h3>

                  <p
                    className="text-xs text-slate-400 mt-2"
                  >
                    Bezpieczne operacje administracyjne przez Cloudflare.
                  </p>

                  <div
                    className={`mt-4 text-xs font-black ${
                      apiStatus ===
                      "online"
                        ? "text-emerald-600"
                        : "text-rose-600"
                    }`}
                  >
                    ● {
                      apiStatus
                    }
                  </div>

                </div>


                <div
                  className="card p-6"
                >

                  <h3
                    className="font-black text-lg"
                  >
                    Cal.com
                  </h3>

                  <p
                    className="text-xs text-slate-400 mt-2"
                  >
                    Scheduler API:
                  </p>

                  <div
                    className="text-[10px] mt-2 text-purple-600 break-all"
                  >
                    {
                      SCHEDULER_API_URL
                    }
                  </div>

                </div>

              </section>
            )
          }


          {/* SETTINGS */}

          {
            activeTab ===
            "settings" &&
            (
              <section
                className="max-w-2xl"
              >

                <div
                  className="card p-6"
                >

                  <h2
                    className="font-black text-xl"
                  >
                    Ustawienia centrali
                  </h2>

                  <div
                    className="mt-5 space-y-4"
                  >

                    <label
                      className="text-xs font-bold block"
                    >
                      Strefa czasowa

                      <input
                        disabled
                        className="soft-input mt-2 bg-slate-50"
                        value="Europe/Warsaw"
                      />
                    </label>


                    <label
                      className="text-xs font-bold block"
                    >
                      Dzień wypłaty

                      <input
                        disabled
                        className="soft-input mt-2 bg-slate-50"
                        value="10. dzień miesiąca"
                      />
                    </label>

                  </div>

                </div>

              </section>
            )
          }

        </div>

      </main>


      {/* MOBILE NAV */}

      <div
        className="lg:hidden fixed bottom-3 left-3 right-3 bg-white rounded-2xl shadow-2xl border p-2 z-50 flex overflow-x-auto scrollbar-hide gap-1"
      >

        {
          [
            [
              "dashboard",
              "layout-dashboard"
            ],
            [
              "lessons",
              "calendar-days"
            ],
            [
              "tutors",
              "users"
            ],
            [
              "students",
              "graduation-cap"
            ],
            [
              "payouts",
              "credit-card"
            ],
            [
              "finance",
              "chart-no-axes-combined"
            ]
          ].map(
            ([id, icon]) => (

              <button

                key={id}

                onClick={() =>
                  setActiveTab(id)
                }

                className={`
                  p-3 rounded-xl shrink-0

                  ${
                    activeTab === id
                      ? "bg-purple-100 text-purple-600"
                      : "text-slate-400"
                  }
                `}
              >
                <Icon
                  name={icon}
                />
              </button>

            )
          )
        }

      </div>


      {/* TUTOR ADD / EDIT */}

      {
        tutorModal &&
        (
          <div
            className="fixed inset-0 z-[100] bg-slate-950/60 backdrop-blur-sm grid place-items-center p-4"
          >

            <div
              className="card max-w-lg w-full p-7"
            >

              <div
                className="flex justify-between items-center mb-5"
              >

                <h2
                  className="font-black text-xl"
                >
                  {
                    editingTutor
                      ? "Edytuj korepetytora"
                      : "Dodaj korepetytora"
                  }
                </h2>

                <button
                  onClick={() =>
                    setTutorModal(
                      false
                    )
                  }
                >
                  <Icon
                    name="x"
                  />
                </button>

              </div>


              <form
                onSubmit={
                  saveTutor
                }
                className="space-y-4"
              >

                <input
                  name="name"
                  className="soft-input"
                  required
                  placeholder="Imię i nazwisko"
                  defaultValue={
                    editingTutor?.name ||
                    ""
                  }
                />

                <input
                  name="email"
                  className="soft-input"
                  required
                  type="email"
                  placeholder="E-mail"
                  disabled={
                    !!editingTutor
                  }
                  defaultValue={
                    editingTutor?.email ||
                    ""
                  }
                />

                <input
                  name="iban"
                  className="soft-input"
                  placeholder="IBAN — opcjonalnie"
                  defaultValue={
                    editingTutor?.iban ||
                    ""
                  }
                />

                <input
                  name="calSlug"
                  className="soft-input"
                  placeholder="Cal.com slug"
                  defaultValue={
                    editingTutor?.cal_slug ||
                    ""
                  }
                />


                <div
                  className="flex gap-2 pt-2"
                >

                  <button
                    type="button"
                    onClick={() =>
                      setTutorModal(
                        false
                      )
                    }
                    className="flex-1 py-3 rounded-xl bg-slate-100 font-black text-xs"
                  >
                    Anuluj
                  </button>

                  <button
                    disabled={
                      actionLoading
                    }
                    className="gradient-btn flex-1 py-3 rounded-xl text-white font-black text-xs"
                  >
                    {
                      actionLoading
                        ? "Zapisywanie..."
                        : editingTutor
                          ? "Zapisz"
                          : "Utwórz konto"
                    }
                  </button>

                </div>

              </form>

            </div>

          </div>
        )
      }


      {/* TUTOR PREVIEW */}

      {
        previewTutor &&
        (
          <div
            className="fixed inset-0 z-[100] bg-slate-950/60 backdrop-blur-sm grid place-items-center p-4"
          >

            <div
              className="card max-w-lg w-full p-7"
            >

              <div
                className="flex justify-between"
              >

                <div>

                  <h2
                    className="text-xl font-black"
                  >
                    {
                      previewTutor.name
                    }
                  </h2>

                  <div
                    className="text-xs text-slate-400 mt-1"
                  >
                    {
                      previewTutor.email
                    }
                  </div>

                </div>

                <button
                  onClick={() =>
                    setPreviewTutor(
                      null
                    )
                  }
                >
                  <Icon
                    name="x"
                  />
                </button>

              </div>


              <div
                className="grid grid-cols-2 gap-3 mt-6"
              >

                <div
                  className="bg-slate-50 rounded-xl p-4"
                >

                  <div
                    className="text-[9px] uppercase font-black text-slate-400"
                  >
                    Status
                  </div>

                  <div
                    className="font-black mt-1"
                  >
                    {
                      previewTutor.status
                    }
                  </div>

                </div>

                <div
                  className="bg-slate-50 rounded-xl p-4"
                >

                  <div
                    className="text-[9px] uppercase font-black text-slate-400"
                  >
                    Lekcje
                  </div>

                  <div
                    className="font-black mt-1"
                  >
                    {
                      tutorLessonCount(
                        previewTutor.id
                      )
                    }
                  </div>

                </div>

                <div
                  className="bg-slate-50 rounded-xl p-4 col-span-2"
                >

                  <div
                    className="text-[9px] uppercase font-black text-slate-400"
                  >
                    IBAN
                  </div>

                  <div
                    className="font-mono text-xs mt-1 break-all"
                  >
                    {
                      previewTutor.iban ||
                      "Brak"
                    }
                  </div>

                </div>

              </div>


              <div
                className="space-y-2 mt-6"
              >

                {
                  previewTutor.status ===
                  "active"

                    ? (
                      <button

                        onClick={() =>
                          setTutorStatus(
                            previewTutor,
                            "inactive"
                          )
                        }

                        className="w-full py-3 rounded-xl bg-amber-50 text-amber-700 font-black text-xs"
                      >
                        Dezaktywuj konto
                      </button>
                    )

                    : (
                      <button

                        onClick={() =>
                          setTutorStatus(
                            previewTutor,
                            "active"
                          )
                        }

                        className="w-full py-3 rounded-xl bg-emerald-50 text-emerald-700 font-black text-xs"
                      >
                        Przywróć konto
                      </button>
                    )
                }


                <button

                  disabled={
                    actionLoading
                  }

                  onClick={() =>
                    permanentDeleteTutor(
                      previewTutor
                    )
                  }

                  className="w-full py-3 rounded-xl bg-rose-600 text-white font-black text-xs"
                >
                  Usuń konto i wszystkie dane
                </button>

              </div>

            </div>

          </div>
        )
      }


      {/* LESSON MODAL */}

      {
        lessonModal &&
        (
          <div
            className="fixed inset-0 z-[100] bg-slate-950/60 backdrop-blur-sm grid place-items-center p-4"
          >

            <div
              className="card max-w-lg w-full p-7"
            >

              <div
                className="flex justify-between"
              >

                <h2
                  className="font-black text-xl"
                >
                  Szczegóły lekcji
                </h2>

                <button
                  onClick={() =>
                    setLessonModal(
                      null
                    )
                  }
                >
                  <Icon
                    name="x"
                  />
                </button>

              </div>


              <div
                className="space-y-3 mt-5 text-sm"
              >

                <div>
                  <b>Uczeń:</b>{" "}
                  {
                    lessonModal.student_name
                  }
                </div>

                <div>
                  <b>E-mail:</b>{" "}
                  {
                    lessonModal.student_email ||
                    "—"
                  }
                </div>

                <div>
                  <b>Przedmiot:</b>{" "}
                  {
                    lessonModal.subject
                  }
                </div>

                <div>
                  <b>Poziom:</b>{" "}
                  {
                    lessonModal.level ||
                    "—"
                  }
                </div>

                <div>
                  <b>Data:</b>{" "}
                  {
                    plDate(
                      lessonModal.lesson_date
                    )
                  }
                </div>

                <div>
                  <b>Godzina:</b>{" "}
                  {
                    lessonModal.time_start
                  }
                  {" – "}
                  {
                    lessonModal.time_end
                  }
                </div>

                <div>
                  <b>Status:</b>{" "}
                  {
                    lessonModal.status
                  }
                </div>

              </div>

            </div>

          </div>
        )
      }

    </div>

  );

}


ReactDOM
  .createRoot(
    document.getElementById(
      "root"
    )
  )
  .render(
    <AdminApp />
  );

</script>

</body>
</html>
