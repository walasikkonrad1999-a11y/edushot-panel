async function apiRequest(base, endpoint, session, options={}){
  const url=`${base.replace(/\/+$/,'')}${endpoint.startsWith('/')?endpoint:`/${endpoint}`}`;
  let res;
  try { res=await fetch(url,{...options,headers:{Accept:'application/json','Content-Type':'application/json',...(session?.access_token?{Authorization:`Bearer ${session.access_token}`}:{}) ,...(options.headers||{})}}); }
  catch(e){ throw new Error(`Brak połączenia z API EduSHOT: ${url}`); }
  const raw=await res.text(); let data=null; try{data=raw?JSON.parse(raw):null}catch{}
  if(!res.ok || data?.ok===false) throw new Error(data?.error?.message||data?.error||data?.message||`Błąd API ${res.status}`);
  return data?.data ?? data;
}

  async function loadData(spinner=true){ if(!supabase)return; if(spinner)setLoadingData(true); const [t,l,f,p,s,g,sg,rp,ro,rb,a,to,logs,policy,pricing]=await Promise.all([

        });
        if(error)throw error;
        periodId=data;

      const {error}=await supabase.rpc('mark_payout_paid',{

      });

  async function saveSettings(e){
    e.preventDefault();
    if(!bookingPolicy.id)return showToast('Nie znaleziono rekordu zasad rezerwacji w Supabase.','error');
    setSavingPolicy(true);
    try{
      const payload={
        cancellation_hours:Number(bookingPolicy.cancellation_hours),
        reschedule_hours:Number(bookingPolicy.reschedule_hours),
        currency:bookingPolicy.currency||'PLN',
        updated_at:new Date().toISOString()
      };
      if([payload.cancellation_hours,payload.reschedule_hours].some(v=>!Number.isFinite(v)||v<0))throw new Error('Wartości godzin muszą być nieujemne.');
      const pricingPayload=lessonPricing.map(row=>({...row,student_price:Number(row.student_price),tutor_rate:Number(row.tutor_rate),updated_at:new Date().toISOString()}));
      if(pricingPayload.length!==9||pricingPayload.some(row=>!Number.isFinite(row.student_price)||!Number.isFinite(row.tutor_rate)||row.student_price<row.tutor_rate||row.tutor_rate<0))throw new Error('Sprawdź cennik: każda cena musi być poprawna, a cena klienta nie może być niższa od wynagrodzenia korepetytora.');
      const [{data,error},{error:pricingError}]=await Promise.all([supabase.from('booking_policy').update(payload).eq('id',bookingPolicy.id).select().single(),supabase.from('lesson_pricing').upsert(pricingPayload,{onConflict:'pricing_tier,duration_minutes'})]);
      if(error)throw error;
      if(pricingError)throw pricingError;
      setBookingPolicy(data);
      setLessonPricing(pricingPayload);
      showToast('Zasady i pełny cennik zapisane dla nowych rezerwacji.');
    }catch(error){
      showToast(error?.message||'Nie udało się zapisać zasad rezerwacji.','error');
    }finally{
      setSavingPolicy(false);
    }
  }

      {activeTab==='operations'&&<section className="space-y-5"><div className="card p-5"><div className="flex flex-col lg:flex-row lg:items-center lg:justify-between gap-4"><div><h2 className="font-black text-xl">Centrum działań</h2><p className="text-xs text-slate-400 mt-1">Jedna kolejka dla grafiku, zastępstw, danych korepetytorów, wyników lekcji i rozliczeń.</p></div><div className="flex gap-2 flex-wrap">{[['all','Wszystkie'],['critical','Pilne'],['high','Ważne'],['normal','Standardowe']].map(([key,label])=><button key={key} onClick={()=>setOperationsFilter(key)} className={`px-3 py-2 rounded-xl text-xs font-black border ${operationsFilter===key?'bg-purple-100 text-brand-primary border-purple-200':'bg-white text-slate-500'}`}>{label}</button>)}</div></div><div className="grid sm:grid-cols-3 gap-3 mt-5"><div className="p-4 rounded-2xl bg-rose-50"><div className="text-[9px] uppercase font-black text-rose-600">Pilne</div><div className="text-2xl font-black mt-1">{criticalOperations}</div></div><div className="p-4 rounded-2xl bg-amber-50"><div className="text-[9px] uppercase font-black text-amber-700">Ważne</div><div className="text-2xl font-black mt-1">{operationalItems.filter(x=>x.priority==='high').length}</div></div><div className="p-4 rounded-2xl bg-slate-50"><div className="text-[9px] uppercase font-black text-slate-500">Standardowe</div><div className="text-2xl font-black mt-1">{operationalItems.filter(x=>x.priority==='normal').length}</div></div></div></div><div className="space-y-3">{visibleOperationalItems.map(item=><div key={item.id} className={`card p-5 flex flex-col md:flex-row md:items-center gap-4 ${item.priority==='critical'?'border-rose-200':item.priority==='high'?'border-amber-200':''}`}><span className={`w-11 h-11 rounded-2xl grid place-items-center shrink-0 ${item.priority==='critical'?'bg-rose-100 text-rose-700':item.priority==='high'?'bg-amber-100 text-amber-700':'bg-purple-50 text-brand-primary'}`}><Icon name={item.kind==='conflict'?'users-rou       {activeTab==='settings'&&<section className="max-w-6xl space-y-5"><form onSubmit={saveSettings} className="card p-6"><div className="flex flex-col sm:flex-row sm:items-start sm:justify-between gap-3"><div><h2 className="font-black text-xl">Zasady i cennik EduSHOT</h2><p className="text-sm text-slate-500 mt-1">Cennik dotyczy nowych rezerwacji. Kwoty zapisane przy wcześniejszych lekcjach pozostają bez zmian.</p></div><span className="px-3 py-1.5 rounded-full bg-purple-50 text-brand-primary text-[10px] font-black self-start">{bookingPolicy.currency||'PLN'}</span></div><div className="grid sm:grid-cols-2 gap-4 mt-6"><label className="text-[10px] uppercase font-black text-slate-400">Pełny zwrot do (godz.)<input type="number" min="0" step="1" required className="soft-input mt-1 text-slate-900" value={bookingPolicy.cancellation_hours} onChange={e=>setBookingPolicy(p=>({...p,cancellation_hours:e.target.value}))}/></label><label className="text-[10px] uppercase font-black text-slate-400">Przełożenie do (godz.)<input type="number" min="0" step="1" required className="soft-input mt-1 text-slate-900" value={bookingPolicy.reschedule_hours} onChange={e=>setBookingPolicy(p=>({...p,reschedule_hours:e.target.value}))}/></label></div><div className="mt-7"><div className="flex items-end justify-between gap-3 mb-3"><div><h3 className="font-black text-lg">Cennik lekcji</h3><p className="text-xs text-slate-400 mt-1">Panel korepetytora otrzymuje wyłącznie kolumnę „Korepetytor”.</p></div><span className="text-[10px] font-black text-emerald-600 bg-emerald-50 px-3 py-1.5 rounded-full">9 WARIANTÓW</span></div><div className="overflow-x-auto border rounded-2xl"><table className="w-full min-w-[720px] text-xs"><thead><tr className="bg-slate-50 text-left text-slate-400 uppercase text-[9px]"><th className="p-4">Poziom</th><th className="p-4">Czas</th><th className="p-4">Rodzic płaci</th><th className="p-4">Korepetytor</th><th className="p-4">EduSHOT</th></tr></thead><tbody>{lessonPricing.map     {selectedLesson&&<div className="fixed inset-0 z-[80] bg-slate-950/55 backdrop-blur-sm p-4 flex items-center justify-center" onClick={()=>setSelectedLesson(null)}><div className="card w-full max-w-xl p-6" onClick={e=>e.stopPropagation()}><div className="flex justify-between mb-5"><div><div className="text-[10px] uppercase font-black text-brand-primary">Szczegóły lekcji</div><h3 className="text-xl font-black mt-1">{selectedLesson.student_name}</h3></div><button onClick={()=>setSelectedLesson(null)}><Icon name="x"/></button></div><div className="grid sm:grid-cols-2 gap-3 text-sm"><div className="bg-slate-50 p-3 rounded-xl"><b>Termin</b><div>{plDate(selectedLesson.lesson_date)} • {selectedLesson.time_start}–{selectedLesson.time_end}</div></div><div className="bg-slate-50 p-3 rounded-xl"><b>Przedmiot</b><div>{selectedLesson.subject} • {selectedLesson.level||'—'}</div></div><div className="bg-slate-50 p-3 rounded-xl"><b>Tutor</b><div>{tutors.find(t=>t.id===selectedLesson.tutor_id)?.name||'—'}</div></div><div className="bg-slate-50 p-3 rounded-xl"><b>Status</b><div>{statusLabel(selectedLesson.status,selectedLesson.attendance)}</div></div><div className="bg-slate-50 p-3 rounded-xl"><b>Uczeń / uczennica</b><div>{selectedLesson.student_name||'—'}</div></div><div className="bg-slate-50 p-3 rounded-xl"><b>Rezerwujący</b><div>{selectedLesson.booker_name||selectedLesson.student_name||'—'}</div></div><div className="bg-slate-50 p-3 rounded-xl sm:col-span-2"><b>E-mail rezerwującego</b><div className="break-all">{selectedLesson.booker_email||selectedLesson.student_email||'—'}</div></div></div><div className="mt-3 p-3 rounded-xl bg-purple-50 text-sm"><div className="text-[10px] uppercase font-black text-brand-primary mb-1">Wiadomość do korepetytora</div>{selectedLesson.student_message||'Brak wiadomości.'}</div>{(selectedLesson.cancelled_at||selectedLesson.rescheduled_at)&&<div className="mt-3 grid sm:grid-cols-2 gap-3 text-xs">{selectedLesson.cancelled_at&&<div className="p-3 rounded-xl bg-rose-50"><b>Anulowanie</b><div className="mt-1">{new Date(selectedLesson.cancelled_at).toLocaleString('pl-PL')}</div><div className="text-slate-500 mt-1">Wyprzedzenie: {selectedLesson.cancellation_notice_minutes!=null?`${Math.round(selectedLesson.cancellation_notice_minutes/60*10)/10} h`:'—'}</div><div className="mt-1 font-black">{selectedLesson.cancellation_refund_eligible?'Pełny zwrot • tutor 0 zł':selectedLesson.cancellation_tutor_compensation?'Brak zwrotu • tutor pełna stawka':'—'}</div></div>}{selectedLesson.rescheduled_at&&<div className="p-3 rounded-xl bg-sky-50"><b>Przełożenie</b><div className="mt-1">{new Date(selectedLesson.rescheduled_at).toLocaleString('pl-PL')}</div><div className="text-slate-500 mt-1">Wyprzedzenie: {selectedLesson.reschedule_notice_minutes!=null?`${Math.round(selectedLesson.reschedule_notice_minutes/60*10)/10} h`:'—'}</div><div className="mt-1">{selectedLesson.rescheduled_from_booking_id?'Nowy termin po przełożeniu':selectedLesson.rescheduled_to_booking_id?'Stary termin — bez naliczenia':''}</div></div>}</div>}<div className="mt-3 p-4 rounded-2xl bg-slate-950 text-white"><div className="flex items-center justify-between gap-3"><div><div className="text-[9px] uppercase font-black text-slate-400">Stan finansowy</div><div className="font-black mt-1">{isRevenueRecognized(selectedLesson,financeMap[selectedLesson.id])?'Przychód rozpoznany':'Jeszcze bez przychodu'}</div></div><span className={`text-[9px] px-2 py-1 rounded-full font-black ${isRevenueRecognized(selectedLesson,financeMap[selectedLesson.id])?'bg-emerald-500/20 text-emerald-300':'bg-white/10 text-slate-300'}`}>{isRevenueRecognized(selectedLesson,financeMap[selectedLesson.id])?'FINALNE':'0 ZŁ'}</span></div><div className="grid grid-cols-3 gap-2 mt-3 text-xs"><div><div className="text-slate-400 text-[9px] uppercase">Przychód</div><b>{money(isRevenueRecognized(selectedLesson,financeMap[selectedLesson.id])?financeMap[selectedLesson.id]?.student_price:0)}</b></div><div><div className="text-slate-400 text-[9px] uppercase">Tutor</div><b>{money(isRevenueRecognized(selectedLesson,financeMap[selectedLesson.id])?financeMap[selectedLesson.id]?.tutor_rate:0)}</b></div><div><div className="text-slate-400 text-[9px] uppercase">Marża</div><b>{money(isRevenueRecognized(selectedLesson,financeMap[selectedLesson.id])?(Number(financeMap[selectedLesson.id]?.student_price||0)-Number(financeMap[selectedLesson.id]?.tutor_rate||0)-Number(financeMap[selectedLesson.id]?.payment_fee||0)):0)}</b></div></div>{!isRevenueRecognized(selectedLesson,financeMap[selectedLesson.id])&&['scheduled','confirmed'].includes(selectedLesson.status)&&<div className="text-[10px] text-slate-400 mt-3">Przychód zostanie naliczony dopiero po finalnym oznaczeniu lekcji przez korepetytora.</div>}</div><div className="mt-5 flex flex-wrap gap-2">{selectedLesson.meet_url&&<a target="_blank" rel="noopener noreferrer" href={selectedLesson.meet_url} className="gradient-cta text-white px-4 py-2.5 rounded-xl text-xs font-black">Otwórz Google Meet</a>}<div className="w-full mt-2 p-3 rounded-xl bg-slate-50 text-xs text-slate-500">Status operacyjny jest ustawiany przez Cal.com albo przez korepetytora po rozpoczęciu lekcji. Administrator nie zmienia go ręcznie, aby zachować spójność rozliczeń.</div></div></div></div>}

    {selectedTutor&&<div className="fixed inset-0 z-[80] bg-slate-950/55 backdrop-blur-sm p-3 sm:p-5 flex items-center justify-center" onClick={()=>setSelectedTutor(null)}><div className="card w-full max-w-5xl max-h-[90vh] overflow-auto p-5 sm:p-7" onClick={e=>e.stopPropagation()}><div className="flex justify-between gap-4"><div className="flex gap-3 items-center"><div className="w-12 h-12 rounded-2xl bg-purple-100 text-brand-primary grid place-items-center font-black text-xl">{selectedTutor.name?.[0]}</div><div><h3 className="font-black text-xl">{selectedTutor.name}</h3><div className="text-xs text-slate-400">{selectedTutor.email}</div></div></div><button onClick={()=>setSelectedTutor(null)}><Icon name="x"/></button></div><div className="flex gap-2 overflow-auto mt-5 pb-1">{[['summary','Podsumowanie'],['lessons','Lekcje'],['availability','Dostępność'],['payouts','Rozliczenia']].map(([id,label])=><button key={id} onClick={()=>setTutorDetailTab(id)} className={`tab-btn ${tutorDetailTab===id?'active':''} shrink-0 px-3 py-2 rounded-xl border text-xs font-black`}>{label}</button>)}</div>{tutorDetailTab==='summary'&&<div className="grid sm:grid-cols-2 lg:grid-cols-4 gap-3 mt-5"><div className="bg-slate-50 p-4 rounded-2xl"><div className="text-[9px] uppercase text-slate-400 font-black">Status</div><div className="font-black">{selectedTutor.status}</div></div><div className="bg-slate-50 p-4 rounded-2xl"><div className="text-[9px] uppercase text-slate-400 font-black">Slug Cal.com</div><div className="font-black text-brand-primary">{selectedTutor.cal_slug||'—'}</div></div><div className="bg-slate-50 p-4 rounded-2xl"><div className="text-[9px] uppercase text-slate-400 font-black">Schedule ID</div><div className="font-mono text-xs font-black">{selectedTutor.cal_schedule_id||'—'}</div></div><div className="bg-slate-50 p-4 rounded-2xl"><div className="text-[9px] uppercase text-slate-400 font-black">IBAN</div><div className="font-mono text-xs">{selectedTutor.iban||'—'}</div></div></div>}{tutorDetailTab==='lessons'&&<div className="mt-5 space-y-2">{lessons.filter(l=>l.tutor_id===selectedTutor.id).map(l=><button key={l.id} onClick={()=>{setSelectedTutor(null);setSelectedLesson(l)}} className="w-full p-3 rounded-xl bg-slate-50 flex justify-between text-left text-xs"><span><b>{plDate(l.lesson_date)} {l.time_start}</b> — {l.student_name}</span><span>{statusLabel(l.status,l.attendance)}</span></button>)}</div>}{tutorDetailTab==='availability'&&<div className="mt-5"><div className="text-sm font-black mb-3">Grafik zapisany w bazie/cache</div>{availability.filter(a=>a.tutor_id===selectedTutor.id).length?availability.filter(a=>a.tutor_id===selectedTutor.id).map(a=><div key={a.id} className="p-3 bg-slate-50 rounded-xl mb-2 text-xs">Dzień {a.day_of_week}: <b>{a.start_time}–{a.end_time}</b></div>):<div className="p-5 bg-slate-50 rounded-xl text-xs text-slate-400">Brak rekordów tutor_availability. Aktualny scheduling może być przechowywany w Cal.com / schedule_data.</div>}</div>}{tutorDetailTab==='payouts'&&<div className="mt-5 space-y-2">{settlementGroups.filter(g=>g.tutor.id===selectedTutor.id).slice(0,12).map(g=><div key={g.key} className="p-4 bg-slate-50 rounded-2xl flex justify-between"><div><b>{monthLabel(g.monthKey)}</b><div className="text-[10px] text-slate-400">{g.items.length} lekcji</div></div><div className="text-right"><b>{money(g.amount)}</b><div className="text-[10px] text-brand-primary font-black">{monthStatus(g.monthKey,g.allPaid)}</div></div></div>)}</div>}</div></div>}

{tutorToDelete&&<div className="fixed inset-0 z-[95] bg-slate-950/60 backdrop-blur-sm p-4 flex items-center justify-center" onClick={()=>!isActionLoading&&setTutorToDelete(null)}><div className="card w-full max-w-md p-6" onClick={e=>e.stopPropagation()}><div className="w-12 h-12 rounded-2xl bg-rose-100 text-rose-600 grid place-items-center mb-4"><Icon name="trash-2" size={21}/></div><h3 className="font-black text-xl">Usunąć korepetytora?</h3><p className="text-sm text-slate-500 mt-2 leading-6">Usuniesz dostęp do panelu dla <b>{tutorToDelete.name}</b> i zwolnisz adres <b>{tutorToDelete.email}</b>, aby można było zaprosić go ponownie.</p><div className="mt-4 p-4 rounded-2xl bg-amber-50 text-amber-800 text-xs leading-5"><b>Historia zostanie zachowana.</b> Dotychczasowe lekcje i rozliczenia nie zostaną skasowane.</div><div className="flex gap-3 mt-6"><button disabled={isActionLoading} onClick={()=>setTutorToDelete(null)} className="flex-1 py-3 rounded-xl bg-slate-100 font-black text-xs">Anuluj</button><button disabled={isActionLoading} onClick={handleDeleteTutor} className="flex-1 py-3 rounded-xl bg-rose-600 text-white font-black text-xs disabled:opacity-60">{isActionLoading?'Usuwanie...':'Usuń konto'}</button></div></div></div>}
   {addStudentModal&&<div className="fixed inset-0 z-[92] bg-slate-950/60 backdrop-blur-sm p-4 flex items-center justify-center" onClick={()=>!isActionLoading&&setAddStudentModal(false)}><div className="card w-full max-w-xl max-h-[92vh] overflow-auto p-6" onClick={e=>e.stopPropagation()}><div className="flex justify-between mb-5"><div><div className="text-[10px] uppercase font-black text-brand-primary">Stały uczeń</div><h3 className="font-black text-xl mt-1">{editStudentData?'Edytuj dane':'Dodaj ucznia'}</h3></div><button onClick={()=>setAddStudentModal(false)}><Icon name="x"/></button></div><form onSubmit={handleSaveStudent} className="space-y-4"><div className="p-4 rounded-2xl bg-purple-50"><div className="text-[10px] uppercase font-black text-brand-primary mb-3">Dane ucznia</div><label className="text-[10px] uppercase font-black text-slate-400">Imię i nazwisko<input name="studentName" required defaultValue={editStudentData?.name||''} className="soft-input mt-1 bg-white text-slate-900"/></label><label className="block text-[10px] uppercase font-black text-slate-400 mt-3">Początek współpracy<input name="startedOn" type="date" required defaultValue={editStudentData?.started_on||warsawDateKey()} className="soft-input mt-1 bg-white text-slate-900"/></label></div><div className="p-4 rounded-2xl bg-slate-50"><div className="text-[10px] uppercase font-black text-slate-500 mb-3">Rodzic / opiekun</div><label className="text-[10px] uppercase font-black text-slate-400">Imię i nazwisko<input name="guardianName" required defaultValue={editStudentData?.guardian?.name||''} className="soft-input mt-1 bg-white text-slate-900"/></label><div className="grid sm:grid-cols-2 gap-3 mt-3"><label className="text-[10px] uppercase font-black text-slate-400">E-mail<input name="guardianEmail" type="email" defaultValue={editStudentData?.guardian?.email||''} className="soft-input mt-1 bg-white text-slate-900"/></label><label className="text-[10px] uppercase font-black text-slate-400">Telefon<in    {studentToEnd&&<div className="fixed inset-0 z-[96] bg-slate-950/60 backdrop-blur-sm p-4 flex items-center justify-center" onClick={()=>!isActionLoading&&setStudentToEnd(null)}><div className="card w-full max-w-md p-6" onClick={e=>e.stopPropagation()}><div className="w-12 h-12 rounded-2xl bg-rose-100 text-rose-600 grid place-items-center mb-4"><Icon name="user-minus" size={21}/></div><h3 className="font-black text-xl">Zakończyć współpracę?</h3><p className="text-sm text-slate-500 mt-2 leading-6">Uczeń <b>{studentToEnd.name}</b> zostanie oznaczony jako zakończony. Dane, historia lekcji i rozliczenia pozostaną zachowane.</p><label className="block text-[10px] uppercase font-black text-slate-400 mt-4">Powód zakończenia<textarea required maxLength="500" value={studentEndReason} onChange={e=>setStudentEndReason(e.target.value)} className="soft-input mt-1 min-h-[90px] resize-none text-slate-900" placeholder="Np. rezygnacja rodzica, zakończenie roku szkolnego..."/></label><div className="flex gap-3 mt-6"><button disabled={isActionLoading} onClick={()=>setStudentToEnd(null)} className="flex-1 py-3 rounded-xl bg-slate-100 font-black text-xs">Anuluj</button><button disabled={isActionLoading||!studentEndReason.trim()} onClick={handleEndStudent} className="flex-1 py-3 rounded-xl bg-rose-600 text-white font-black text-xs disabled:opacity-50">{isActionLoading?'Zapisywanie...':'Zakończ współpracę'}</button></div></div></div>}
   {timeOffTutor&&<div className="fixed inset-0 z-[95] bg-slate-950/60 backdrop-blur-sm p-4 flex items-center justify-center" onClick={()=>setTimeOffTutor(null)}><div className="card w-full max-w-lg p-6" onClick={e=>e.stopPropagation()}><div className="flex justify-between gap-4"><div><div className="text-[10px] uppercase font-black text-amber-600">Nieobecność korepetytora</div><h3 className="font-black text-xl mt-1">{timeOffTutor.name}</h3></div><button onClick={()=>setTimeOffTutor(null)}><Icon name="x"/></button></div><div className="mt-4 p-4 rounded-2xl bg-amber-50 border border-amber-100 text-xs text-amber-800">Zapis zablokuje te dni w Cal.com. Stałe lekcje pozostaną widoczne i zostaną oznaczone jako wymagające zastępstwa.</div><form onSubmit={handleAddTutorTimeOff} className="space-y-4 mt-5"><div className="grid sm:grid-cols-2 gap-3"><label className="text-[10px] uppercase font-black text-slate-400">Od<input name="dateFrom" type="date" required min={warsawDateKey()} className="soft-input mt-1"/></label><label className="text-[10px] uppercase font-black text-slate-400">Do<input name="dateTo" type="date" required min={warsawDateKey()} className="soft-input mt-1"/></label></div><label className="text-[10px] uppercase font-black text-slate-400">Powód<textarea name="reason" required maxLength="500" rows="3" className="soft-input mt-1 resize-none" placeholder="np. urlop, choroba"/></label><div className="flex gap-3"><button type="button" onClick={()=>setTimeOffTutor(null)} className="flex-1 py-3 rounded-xl bg-slate-100 font-black text-xs">Anuluj</button><button disabled={isActionLoading} className="flex-1 py-3 rounded-xl bg-amber-500 text-white font-black text-xs">{isActionLoading?'Zapisywanie...':'Zapisz i zsynchronizuj'}</button></div></form></div></div>}
   {addTutorModal&&<div className="fixed inset-0 z-[90] bg-slate-950/60 backdrop-blur-sm p-4 flex items-center justify-center" onClick={()=>setAddTutorModal(false)}><div className="card w-full max-w-lg p-6" onClick={e=>e.stopPropagation()}><div className="flex justify-between mb-5"><h3 className="font-black text-xl">{editTutorData?'Edytuj korepetytora':'Dodaj korepetytora'}</h3><button onClick={()=>setAddTutorModal(false)}><Icon name="x"/></button></div><form onSubmit={handleSaveTutor} className="space-y-4"><label className="text-[10px] uppercase font-black text-slate-400">Imię i nazwisko<input name="name" required defaultValue={editTutorData?.name||''} className="soft-input mt-1"/></label><label className="text-[10px] uppercase font-black text-slate-400">E-mail<input name="email" type="email" required disabled={!!editTutorData} defaultValue={editTutorData?.email||''} className="soft-input mt-1 disabled:bg-slate-50"/></label><label className="text-[10px] uppercase font-black text-slate-400">IBAN<input name="iban" defaultValue={editTutorData?.iban||''} className="soft-input mt-1 font-mono"/></label><label className="text-[10px] uppercase font-black text-slate-400">Cal.com slug<input name="slug" required defaultValue={editTutorData?.cal_slug||''} className="soft-input mt-1"/></label><label className="text-[10px] uppercase font-black text-slate-400">Cal.com Schedule ID<input name="scheduleId" defaultValue={editTutorData?.cal_schedule_id||''} className="soft-input mt-1 font-mono" placeholder="np. 123456"/><span className="block normal-case tracking-normal font-medium text-slate-400 mt-1">ID harmonogramu Dostępność w Cal.com. To pole spina grafik tutora z panelem EduSHOT.</span></label><div className="flex gap-3 pt-2"><button type="button" onClick={()=>setAddTutorModal(false)} className="flex-1 py-3 rounded-xl bg-slate-100 font-black text-xs">Anuluj</button><button disabled={isActionLoading} className="flex-1 py-3 rounded-xl gradient-cta text-white font-black text-xs">{isActionLoading?'Zapisywanie...':editTutorData?'Zapisz zmiany':'Utwórz konto'}</button></div></form></div></div>}
  </div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<AdminApp/>);
</script>
</body>
</html>
