    {activeTab==='dashboard'&&<section className="space-y-6"><div className="flex flex-col sm:flex-row sm:justify-between gap-3"><div><h1 className="text-3xl font-black">Cześć, {profile?.name?.split(' ')[0]} 👋</h1><p className="text-sm text-slate-500 mt-1">Oto podsumowanie Twojego dnia w EduSHOT.</p></div><button onClick={()=>setActiveTab('availability')} className="gradient-btn text-white px-5 py-3 rounded-2xl text-xs font-black self-start">Edytuj dostępność</button></div>{nextLesson?<div className="card p-6 lg:p-8 bg-gradient-to-br from-white to-purple-50"><div className="flex flex-col lg:flex-row gap-6 lg:items-center justify-between"><div><div className="flex gap-2 mb-3"><span className="text-[9px] font-black px-2 py-1 rounded-full bg-purple-100 text-brand-primary">NAJBLIŻSZA LEKCJA</span><span className={`text-[9px] font-black px-2 py-1 rounded-full ${canMarkLesson(nextLesson)?'bg-amber-100 text-amber-700':'bg-purple-100 text-brand-primary'}`}>{canMarkLesson(nextLesson)?'DO OZNACZENIA':'NADCHODZI'}</span></div><h2 className="text-2xl sm:text-3xl font-black">{nextLesson.subject} — {nextLesson.level||'zajęcia'}</h2><div className="text-sm text-slate-500 mt-3">Uczeń: <b className="text-slate-900">{nextLesson.student_name}</b> • {nextLesson.duration_minutes||60} min</div></div><div className="lg:text-right"><div className="text-[10px] uppercase font-black text-slate-400">{canMarkLesson(nextLesson)?'Wymaga oznaczenia':'Do rozpoczęcia'}</div><div className="text-3xl font-black text-brand-primary font-mono">{countdown}</div><div className="text-xs text-slate-400 mt-1">{plDate(nextLesson.lesson_date)} • {nextLesson.time_start}</div><div className="flex gap-2 mt-4"><button onClick={()=>setSelectedLesson(nextLesson)} className="px-4 py-3 rounded-xl border bg-white text-xs font-black">Szczegóły</button>{nextLesson.meet_url?<a href={nextLesson.meet_url} target="_blank" rel="noopener noreferrer" className="gradient-btn px-4 py-3 rounded-xl text-white text-xs font-black">Otwórz Google Meet</a>:<button disabled className="px-4 py-3 rounded-xl bg-slate-100 text-slate-400 text-xs font-black">Brak linku</button>}</div></div></div></div>:<div className="card p-8"><div className="font-black text-xl">Brak nadchodzących lekcji 🎉</div><div className="text-sm text-slate-400 mt-1">Gdy pojawi się rezerwacja, zobaczysz ją tutaj automatycznie.</div></div>}

 font-black text-sky-600">PODSTAWA</div><div className="font-black mt-1">{basicCount} × 35 zł</div></div><div className="bg-amber-50 rounded-xl p-3"><div className="text-[9px] font-black text-amber-600">ROZSZERZENIE</div><div className="font-black mt-1">{extendedCount} × 40 zł</div></div></div><button onClick={()=>setActiveTab('earnings')} className="mt-4 text-xs font-black text-brand-primary">Zobacz rozliczenia →</button></div></div>

    {activeTab==='lessons'&&<section className="space-y-5"><div className="flex gap-2 overflow-auto pb-1">{[['scheduled','Zaplanowane'],['today','Dzisiaj'],['completed','Odbyte'],['no_show','Nieobecności'],['cancelled','Anulowane'],['rescheduled','Przełożone'],['all','Wszystkie']].map(([id,label])=><button key={id} onClick={()=>setLessonFilter(id)} className={`shrink-0 px-4 py-2 rounded-xl text-xs font-black border ${lessonFilter===id?'bg-purple-100 text-brand-primary border-purple-200':'bg-white text-slate-500'}`}>{label}</button>)}</div><div className="space-y-2">{filteredLessons.map(l=><button key={l.id} onClick={()=>setSelectedLesson(l)} className="card p-4 w-full flex gap-4 items-center text-left"><div className="w-16 font-black text-brand-primary text-center">{l.time_start}<div className="text-[9px] text-slate-400">{plDate(l.lesson_date)}</div></div><div className="flex-1"><div className="font-black text-sm">{l.subject} • {l.level||'—'}</div><div className="text-xs text-slate-400">{l.student_name} • <b>{money(rateOf(l))}</b></div></div><span className={`text-[9px] font-black px-2 py-1 rounded-full uppercase ${statusClass(l.status,l.attendance)}`}>{statusLabel(l.status,l.attendance)}</span></button>)}{!filteredLessons.length&&<div className="card p-10 text-center text-slate-400">Brak lekcji.</div>}</div></section>}

  </div></main>
  <nav className="md:hidden fixed bottom-0 inset-x-0 z-40 bg-white border-t p-2 flex gap-1 overflow-x-auto">{[['dashboard','Start','home'],['lessons','Lekcje','video'],['availability','Dostępność','calendar-clock'],['earnings','Wypłaty','wallet-cards'],['notifications','Alerty','bell'],['profile','Profil','user-round'],['settings','Ustawienia','sliders-horizontal']].map(([id,label,icon])=><button key={id} onClick={()=>setActiveTab(id)} className={`min-w-[68px] flex-1 py-2 rounded-xl text-[9px] font-black flex flex-col items-center gap-1 ${activeTab===id?'text-brand-primary bg-purple-50':'text-slate-400'}`}><Icon name={icon} size={17}/>{label}</button>)}</nav>
  {selectedLesson&&<div className="fixed inset-0 z-[80] bg-slate-950/55 backdrop-blur-sm p-4 flex items-center justify-center" onClick={()=>setSelectedLesson(null)}><div className="card w-full max-w-lg p-6 max-h-[92vh] overflow-y-auto" onClick={e=>e.stopPropagation()}><div className="flex justify-between"><div><div className="text-[10px] uppercase font-black text-brand-primary">Szczegóły lekcji</div><h3 className="font-black text-xl mt-1">{selectedLesson.student_name}</h3></div><button onClick={()=>setSelectedLesson(null)}><Icon name="x"/></button></div><div className="grid grid-cols-2 gap-3 mt-5 text-xs"><div className="bg-slate-50 p-3 rounded-xl"><b>Data</b><div>{plDate(selectedLesson.lesson_date)}</div></div><div className="bg-slate-50 p-3 rounded-xl"><b>Godzina</b><div>{selectedLesson.time_start}–{selectedLesson.time_end}</div></div><div className="bg-slate-50 p-3 rounded-xl"><b>Przedmiot</b><div>{selectedLesson.subject}</div></div><div className="bg-slate-50 p-3 rounded-xl"><b>Poziom</b><div>{selectedLesson.level||'—'}</div></div><div className="bg-slate-50 p-3 rounded-xl"><b>Stawka</b><div>{money(rateOf(selectedLesson))}</div></div><div className="bg-slate-50 p-3 rounded-xl"><b>Status</b><div>{statusLabel(selectedLesson.status,selectedLesson.attendance)}</div></div></div><div className="mt-3 p-4 bg-purple-50 rounded-xl text-xs"><div className="text-[9px] uppercase font-black text-brand-primary mb-1">Wiadomość do korepetytora</div>{selectedLesson.student_message||'Brak wiadomości.'}</div>{selectedLesson.status==='cancelled'&&<div className="mt-3 p-3 rounded-xl bg-slate-50 border border-slate-100 text-xs"><b>Anulowana ≥24 h przed startem.</b><div className="text-slate-500 mt-1">Bez naliczenia wynagrodzenia.</div></div>}{selectedLesson.status==='cancelled_late'&&<div className="mt-3 p-3 rounded-xl bg-orange-50 border border-orange-100 text-xs text-orange-800"><b>Anulowana &lt;24 h przed startem.</b><div className="mt-1">Pełna stawka {money(rateOf(selectedLesson))} jest naliczona.</div></div>}{selectedLesson.status==='rescheduled'&&<div className="mt-3 p-3 rounded-xl bg-sky-50 border border-sky-100 text-xs text-sky-800"><b>Przełożona.</b><div className="mt-1">Stary termin nie jest rozliczany; płatny może być wyłącznie nowy termin.</div></div>}<div className="mt-5 space-y-2">{selectedLesson.meet_url&&<a href={selectedLesson.meet_url} target="_blank" rel="noopener noreferrer" className="gradient-btn text-white w-full py-3 rounded-xl font-black text-xs flex justify-center">Otwórz Google Meet</a>}{isLessonPending(selectedLesson)&&<>{!canMarkLesson(selectedLesson)&&<div className="p-3 rounded-xl bg-amber-50 border border-amber-100 text-amber-700 text-xs font-bold">Status lekcji będzie można oznaczyć od godziny {selectedLesson.time_start}.</div>}<button disabled={!canMarkLesson(selectedLesson)||statusSaving===selectedLesson.id} onClick={()=>updateLessonStatus(selectedLesson.id,'completed','held')} className={`w-full py-3 rounded-xl text-white font-black text-xs ${canMarkLesson(selectedLesson)&&statusSaving!==selectedLesson.id?'bg-emerald-500':'bg-slate-300 cursor-not-allowed'}`}>✓ Lekcja odbyła się</button><button disabled={!canMarkLesson(selectedLesson)||statusSaving===selectedLesson.id} onClick={()=>updateLessonStatus(selectedLesson.id,'completed','late')} className={`w-full py-3 rounded-xl text-white font-black text-xs ${canMarkLesson(selectedLesson)&&statusSaving!==selectedLesson.id?'bg-amber-500':'bg-slate-300 cursor-not-allowed'}`}>⏱ Uczeń spóźniony</button><button disabled={!canMarkLesson(selectedLesson)||statusSaving===selectedLesson.id} onClick={()=>updateLessonStatus(selectedLesson.id,'completed','no_show')} className={`w-full py-3 rounded-xl text-white font-black text-xs ${canMarkLesson(selectedLesson)&&statusSaving!==selectedLesson.id?'bg-rose-500':'bg-slate-300 cursor-not-allowed'}`}>✕ Uczeń nie przyszedł</button></>}{!isLessonPending(selectedLesson)&&<div className={`p-3 rounded-xl text-xs font-black ${statusClass(selectedLesson.status,selectedLesson.attendance)}`}>Status zapisany: {statusLabel(selectedLesson.status,selectedLesson.attendance)}</div>}</div></div></div>}
  </div>
}
ReactDOM.createRoot(document.getElementById('root')).render(<TutorApp/>);
</script></body></html>
