x gap-4 items-center text-left"><div className="w-16 font-black text-brand-primary text-center">{l.time_start}<div className="text-[9px] text-slate-400">{plDate(l.lesson_date)}</div></div><div className="flex-1"><div className="flex flex-wrap items-center gap-2"><div className="font-black text-sm">{l.subject} • {l.level||'—'}</div>{isRegularLesson(l)&&<span className="px-2 py-1 rounded-full bg-fuchsia-50 text-fuchsia-700 text-[8px] font-black">STAŁA</span>}{isSubstitution(l)&&<span className="px-2 py-1 rounded-full bg-sky-50 text-sky-700 text-[8px] font-black">ZASTĘPSTWO</span>}</div><div className="text-xs text-slate-400 mt-1">{l.student_name} • Twoje wynagrodzenie: <b>{money(rateOf(l,tutorRates))}</b></div>{l.operational_note&&l.operational_note.startsWith('Nieobecność')&&<div className="text-[10px] text-amber-700 font-bold mt-1">{l.operational_note}</div>}</div><span className={`text-[9px] font-black px-2 py-1 rounded-full uppercase ${statusClass(l.status,l.attendance)}`}>{statusLabel(l.status,l.attendance)}</span></button>)}{!filteredLessons.length&&<div className="card p-10 text-center text-slate-400">Brak lekcji w tej kategorii.</div>}</div></section>}

    {activeTab==='earnings'&&<section className="space-y-5"><div><h1 className="section-title">Moje rozliczenia</h1><p className="text-sm text-slate-500 mt-1">Widzisz wyłącznie własne wynagrodzenie i status wypłaty.</p></div><div className="grid sm:grid-cols-2 lg:grid-cols-4 gap-4"><div className="card p-5 money-card"><div className="text-[9px] uppercase font-black text-slate-400">Ten miesiąc</div><div className="text-3xl font-black mt-2">{money(earningsThisMonth)}</div></div><div className="card p-5"><div className="text-[9px] uppercase font-black text-slate-400">Do wypłaty</div><div className="text-3xl font-black mt-2 text-emerald-600">{money(pendingEarnings)}</div></div><div className="card p-5"><div className="text-[9px] uppercase font-black text-slate-400">Lekcje podstawowe</div><div className="text-2xl font-black mt-2">{basicCount}</div></div><div className="card p-5"><div className="text-[9px] uppercase font-black text-slate-400">Lekcje rozszerzone</div><div className="text-2xl font-black mt-2">{extendedCount}</div></div></div><div className="grid xl:grid-cols-[1fr_360px] gap-5"><div className="card overflow-hidden"><div className="p-5 border-b"><h2 className="font-black text-lg">Historia miesięczna</h2><p className="text-xs text-slate-400 mt-1">Status wypłaty jest wspólny z panelem administratora.</p></div><div className="overflow-x-auto"><table className="w-full min-w-[620px] text-xs"><thead><tr className="text-left text-slate-400"><th className="p-4">Miesiąc</th><th className="p-4">Lekcje</th><th className="p-4">Czas</th><th className="p-4">Twoja kwota</th><th className="p-4">Status</th></tr></thead><tbody>{payoutRows.map(p=><tr key={p.id} className="border-t"><td className="p-4 font-black">{new Date(p.year,p.month-1,1).toLocaleDateString('pl-PL',{month:'long',year:'numeric'})}</td><td className="p-4">{p.lesson_count||0}</td><td className="p-4">{(Number(p.total_minutes||0)/60).toFixed(1)} h</td><td className="p-4 font-black">{money(p.total_amount)}</td><td className="p-4"><span className={`px-2 py-1 rounded-full text-[9px] font-black ${p.status==='PAID'?'bg-emerald-100 text-emerald-700':p.status==='OVERDUE'?'bg-rose-100 text-rose-700':p.status==='READY_TO_PAY'?'bg-amber-100 text-amber-700':'bg-purple-100 text-purple-700'}`}>{p.status==='PAID'?'WYPŁACONE':p.status==='READY_TO_PAY'?'DO WYPŁATY':p.status==='OVERDUE'?'PO TERMINIE':'NALICZANIE'}</span></td></tr>)}{!payoutRows.length&&<tr><td colSpan="5" className="p-10 text-center text-slate-400">Historia pojawi się po pierwszych rozliczonych lekcjach.</td></tr>}</tbody></table></div></div><div className="space-y-4"><div className="card p-5"><h3 className="font-black">Twoje stawki</h3><div className="mt-3 space-y-2">{tutorRates.map(r=><div key={`${r.pricing_tier}-${r.duration_minutes}`} className="p-3 rounded-xl bg-purple-50 flex justify-between gap-3"><span className="font-bold text-xs">{{primary_school:'Szkoła podstawowa',secondary_basic:'Średnia — podstawa',secondary_extended:'Średnia — rozszerzenie'}[r.pricing_tier]} • {r.duration_minutes} min</span><b>{money(r.tutor_rate)}</b></div>)}</div><p className="text-[10px] text-slate-400 mt-3 leading-5">Wynagrodzenie jest naliczane za lekcję odbytą, spóźnienie, nieobecność ucznia oraz anulowanie mniej niż {bookingPolicy.cancellation_hours} h przed startem.</p></div><div className="card p-5"><div className="text-[9px] uppercase font-black text-slate-400">Numer do wypłaty</div><div className="font-mono text-xs font-bold mt-2 break-all">{profile?.iban||'Nie ustawiono numeru IBAN'}</div></div></div></div></section>}
    {activeTab==='profile'&&<section className="max-w-2xl space-y-5"><div><h1 className="section-title">Mój profil</h1><p className="text-sm text-slate-500 mt-1">Twój profil EduSHOT.</p></div><div className="card p-6 space-y-4"><div className="grid sm:grid-cols-2 gap-4"><div className="p-4 rounded-2xl bg-slate-50"><div className="text-[9px] uppercase font-black text-slate-400">Imię i nazwisko</div><div className="font-black mt-1">{profile?.name||'—'}</div></div><div className="p-4 rounded-2xl bg-slate-50"><div className="text-[9px] uppercase font-black text-slate-400">Status konta</div><div className="font-black mt-1 text-emerald-600">Aktywny</div></div><div className="p-4 rounded-2xl bg-slate-50 sm:col-span-2"><div className="text-[9px] uppercase font-black text-slate-400">E-mail</div><div className="font-bold mt-1 break-all">{profile?.email||session?.user?.email||'—'}</div></div><div className="p-4 rounded-2xl bg-slate-50"><div className="text-[9px] uppercase font-black text-slate-400">Strefa czasowa</div><div className="font-bold mt-1">{profile?.timezone||'Europe/Warsaw'}</div></div><div className="p-4 rounded-2xl bg-slate-50"><div className="text-[9px] uppercase font-black text-slate-400">Cal.com</div><div className="font-bold mt-1">{profile?.cal_slug?`cal.com/${profile.cal_slug}`:'Przypisane przez EduSHOT'}</div></div></div></div></section>}

{activeTab==='notifications'&&<section className="space-y-4"><div className="flex justify-between"><div><h2 className="font-black text-xl">Powiadomienia</h2><div className="text-xs text-slate-400">{unread} nieprzeczytanych</div></div><button onClick={markAllRead} className="text-xs font-black text-brand-primary">Oznacz wszystkie</button></div><div className="space-y-2">{notifications.map(n=><button key={n.id} onClick={()=>openNotification(n)} className={`card w-full p-4 text-left ${!n.read_at?'border-purple-200 bg-purple-50/40':''}`}><div className="flex gap-3"><span className={`w-10 h-10 shrink-0 rounded-2xl grid place-items-center ${!n.read_at?'bg-purple-100 text-brand-primary':'bg-slate-50 text-slate-400'}`}><Icon name={notificationIcon(n.type)} size={18}/></span><div className="flex-1 min-w-0"><div className="flex justify-between gap-3"><div className="font-black text-sm">{n.title}</div>{!n.read_at&&<span className="w-2 h-2 shrink-0 rounded-full bg-fuchsia-500 mt-1"/>}</div><div className="text-xs text-slate-500 mt-1 leading-5">{n.message}</div><div className="text-[9px] uppercase tracking-wide font-bold text-slate-400 mt-2">{notificationTime(n.created_at)}</div></div></div></button>)}{!notifications.length&&<div className="card p-10 text-center text-slate-400">Wszystko ogarnięte.</div>}</div></section>}
    {activeTab==='settings'&&<section className="max-w-2xl space-y-5"><div><h1 className="section-title">Ustawienia</h1><p className="text-sm text-slate-500 mt-1">Bezpieczeństwo konta.</p></div><form onSubmit={changePassword} className="card p-6 space-y-4"><h2 className="font-black text-lg">Zmień hasło</h2><p className="text-xs text-slate-400">Hasło musi mieć minimum 8 znaków.</p><div className="grid sm:grid-cols-2 gap-3"><input name="password" type="password" minLength="8" required className="soft-input" placeholder="Nowe hasło"/><input name="repeat" type="password" minLength="8" required className="soft-input" placeholder="Powtórz hasło"/></div><button className="bg-slate-950 text-white px-5 py-3 rounded-xl text-xs font-black">Zmień hasło</button></form></section>}
  </div></main>
  <nav className="mobile-nav md:hidden fixed bottom-0 inset-x-0 z-40 border-t p-2 flex gap-1 overflow-x-auto">{[['dashboard','Start','home'],['lessons','Lekcje','video'],['availability','Dostępność','calendar-clock'],['earnings','Wypłaty','wallet-cards'],['notifications','Alerty','bell'],['profile','Profil','user-round'],['settings','Ustawienia','sliders-horizontal']].map(([id,label,icon])=><button key={id} onClick={()=>setActiveTab(id)} className={`min-w-[68px] flex-1 py-2 rounded-xl text-[9px] font-black flex flex-col items-center gap-1 ${activeTab===id?'text-brand-primary bg-purple-50':'text-slate-400'}`}><Icon name={icon} size={17}/>{label}</button>)}</nav>
  {selectedLesson&&<div className="fixed inset-0 z-[80] bg-slate-950/55 backdrop-blur-sm p-4 flex items-center justify-center" onClick={()=>setSelectedLesson(null)}><div className="card w-full max-w-lg p-6 max-h-[92vh] overflow-y-auto" onClick={e=>e.stopPropagation()}><div className="flex justify-between"><div><div className="text-[10px] uppercase font-black text-brand-primary">Szczegóły lekcji</div><h3 className="font-black text-xl mt-1">{selectedLesson.student_name}</h3></div><button onClick={()=>setSelectedLesson(null)}><Icon name="x"/></button></div><div className="grid grid-cols-2 gap-3 mt-5 text-xs"><div className="bg-slate-50 p-3 rounded-xl"><b>Data</b><div>{plDate(selectedLesson.lesson_date)}</div></div><div className="bg-slate-50 p-3 rounded-xl"><b>Godzina</b><div>{selectedLesson.time_start}–{selectedLesson.time_end}</div></div><div className="bg-slate-50 p-3 rounded-xl"><b>Przedmiot</b><div>{selectedLesson.subject}</div></div><div className="bg-slate-50 p-3 rounded-xl"><b>Poziom</b><div>{selectedLesson.level||'—'}</div></div><div className="bg-emerald-50 p-3 rounded-xl"><b>Twoje wynagrodzenie</b><div className="text-emerald-700 font-black">{money(rateOf(selectedLesson,tutorRates))}</div></div><div className="bg-slate-50 p-3 rounded-xl"><b>Status</b><div>{statusLabel(selectedLesson.status,selectedLesson.attendance)}</div></div></div><div className="mt-3 p-4 bg-purple-50 rounded-xl text-xs"><div className="text-[9px] uppercase font-black text-brand-primary mb-1">Wiadomość do korepetytora</div>{selectedLesson.student_message||'Brak wiadomości.'}</div>{selectedLesson.status==='cancelled'&&<div className="mt-3 p-3 rounded-xl bg-slate-50 border border-slate-100 text-xs"><b>Anulowana ≥{bookingPolicy.cancellation_hours} h przed startem.</b><div className="text-slate-500 mt-1">Bez naliczenia wynagrodzenia.</div></div>}{selectedLesson.status==='cancelled_late'&&<div className="mt-3 p-3 rounded-xl bg-orange-50 border border-orange-100 text-xs text-orange-800"><b>Anulowana &lt;{bookingPolicy.cancellation_hours} h przed startem.</b><div className="mt-1">Twoje pełne wynagrodzenie {money(rateOf(selectedLesson,tutorRates))} jest naliczone.</div></div>}{selectedLesson.status==='rescheduled'&&<div className="mt-3 p-3 rounded-xl bg-sky-50 border border-sky-100 text-xs text-sky-800"><b>Przełożona.</b><div className="mt-1">Stary termin nie jest rozliczany; płatny może być wyłącznie nowy termin.</div></div>}<div className="mt-5 space-y-2">{selectedLesson.meet_url&&<a href={selectedLesson.meet_url} target="_blank" rel="noopener noreferrer" className="gradient-btn text-white w-full py-3 rounded-xl font-black text-xs flex justify-center">Otwórz Google Meet</a>}{isLessonPending(selectedLesson)&&<>{!canMarkLesson(selectedLesson)&&<div className="p-3 rounded-xl bg-amber-50 border border-amber-100 text-amber-700 text-xs font-bold">Status lekcji będzie można oznaczyć od godziny {selectedLesson.time_start}.</div>}<button disabled={!canMarkLesson(selectedLesson)||statusSaving===selectedLesson.id} onClick={()=>updateLessonStatus(selectedLesson.id,'completed','held')} className={`w-full py-3 rounded-xl text-white font-black text-xs ${canMarkLesson(selectedLesson)&&statusSaving!==selectedLesson.id?'bg-emerald-500':'bg-slate-300 cursor-not-allowed'}`}>✓ Lekcja odbyła się</button><button disabled={!canMarkLesson(selectedLesson)||statusSaving===selectedLesson.id} onClick={()=>updateLessonStatus(selectedLesson.id,'completed','late')} className={`w-full py-3 rounded-xl text-white font-black text-xs ${canMarkLesson(selectedLesson)&&statusSaving!==selectedLesson.id?'bg-amber-500':'bg-slate-300 cursor-not-allowed'}`}>⏱ Uczeń spóźniony</button><button disabled={!canMarkLesson(selectedLesson)||statusSaving===selectedLesson.id} onClick={()=>updateLessonStatus(selectedLesson.id,'completed','no_show')} className={`w-full py-3 rounded-xl text-white font-black text-xs ${canMarkLesson(selectedLesson)&&statusSaving!==selectedLesson.id?'bg-rose-500':'bg-slate-300 cursor-not-allowed'}`}>✕ Uczeń nie przyszedł</button></>}{!isLessonPending(selectedLesson)&&<div className={`p-3 rounded-xl text-xs font-black ${statusClass(selectedLesson.status,selectedLesson.attendance)}`}>Status zapisany: {statusLabel(selectedLesson.status,selectedLesson.attendance)}</div>}</div></div></div>}
  </div>
}
ReactDOM.createRoot(document.getElementById('root')).render(<TutorApp/>);
</script></body></html>
